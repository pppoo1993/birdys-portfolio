<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g transform="rotate(-30 12 12)" filter="url(#shadow)">
    <!-- Quill shaft -->
    <line x1="4" y1="22" x2="18" y2="2" stroke="#e8d5a3" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Feather barbs - left -->
    <path d="M8 8 C6 12, 3 18, 4 22" stroke="#ccff00" stroke-width="0.8" fill="none" opacity="0.9"/>
    <path d="M10 6 C7 10, 5 16, 5 22" stroke="#ccff00" stroke-width="0.7" fill="none" opacity="0.7"/>
    <path d="M12 4 C9 8, 8 14, 7 22" stroke="#ccff00" stroke-width="0.6" fill="none" opacity="0.5"/>
    <!-- Feather barbs - right -->
    <path d="M10 8 C13 12, 16 18, 14 22" stroke="#ccff00" stroke-width="0.8" fill="none" opacity="0.9"/>
    <path d="M12 6 C15 10, 18 16, 16 22" stroke="#ccff00" stroke-width="0.7" fill="none" opacity="0.7"/>
    <path d="M14 4 C17 8, 20 14, 18 22" stroke="#ccff00" stroke-width="0.6" fill="none" opacity="0.5"/>
    <!-- Nib tip -->
    <polygon points="18,2 16,6 20,6" fill="#444"/>
  </g>
</svg>
