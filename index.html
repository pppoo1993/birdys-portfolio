<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo2.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BirdyDesign - 展示工作经历与项目" />
    <meta property="og:title" content="BirdyDesign" />
    <meta property="og:description" content="展示工作经历与项目，期待新的机会" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BirdyDesign" />
    <meta name="twitter:description" content="展示工作经历与项目，期待新的机会" />
    <style>
      @font-face {
        font-family: 'Noto Sans SC';
        font-style: normal;
        font-weight: 200 900;
        font-display: swap;
        src: local('PingFang SC'), local('Microsoft YaHei'), local('Hiragino Sans GB'), local('WenQuanYi Micro Hei');
      }
    </style>
    <link rel="preconnect" href="https://picsum.photos" />
    <link rel="preload" as="image" href="/birdys-portfolio/images/hero-bg.jpg" />
    <link rel="preload" as="image" href="/birdys-portfolio/images/头像.png" />
    <title>BirdyDesign</title>
    <style>
      html { overflow-y: scroll !important; }
      ::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }
      ::-webkit-scrollbar-track { display: none !important; }
      ::-webkit-scrollbar-thumb { display: none !important; }
      * { scrollbar-width: none !important; }
      .scroll-progress-line {
        position: fixed;
        right: 2px;
        top: 0;
        width: 2px;
        height: 100vh;
        background: rgba(204,255,0,0.7);
        z-index: 2147483647;
        pointer-events: none;
        transform-origin: top center;
      }
    </style>
    <script>
      history.scrollRestoration = 'manual';
      window.scrollTo(0, 0);
      // Lock scroll position during page load
      var lockScroll = function() { window.scrollTo(0, 0); };
      window.addEventListener('scroll', lockScroll, { passive: false });
      window.addEventListener('load', function() {
        window.scrollTo(0, 0);
        setTimeout(function() {
          window.removeEventListener('scroll', lockScroll);
        }, 500);
      });
    </script>
  </head>
  <body>
    <div id="scroll-progress-line" class="scroll-progress-line"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
